name: Bug report
description: Report a reproducible problem in Clarity.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private database rows, API keys, or sensitive screenshots.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Clarity do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened? Remove credentials and private data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: 1. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, and provider type (no key or account details).
    validations:
      required: true
