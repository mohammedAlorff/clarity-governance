[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-governance"
version = "0.1.0"
description = "Local, human-reviewed data governance for MySQL test sources"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/base.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["governance*"]
namespaces = false

[tool.setuptools.package-data]
governance = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Directly executable scripts insert the project root before local imports.
"scripts/check_public_data.py" = ["E402"]
"scripts/public_data_faults.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
